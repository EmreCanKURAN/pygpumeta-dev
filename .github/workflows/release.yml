name: Release

# Builds the distributions and publishes them with PyPI trusted publishing
# (no API tokens). A manual run publishes to TestPyPI only; publishing a
# GitHub release publishes to TestPyPI and then, after approval of the
# "pypi" environment, to PyPI.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The version must match the release tag
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/pygpumeta/_version.py').read()).group(1))")
          test "v$version" = "${{ github.event.release.tag_name }}"
      - name: Install the wheel in a clean environment and run the CPU tests
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install numpy pytest hypothesis
          /tmp/clean/bin/pip install --no-deps dist/*.whl
          cp -r tests /tmp/tests && cd /tmp
          /tmp/clean/bin/python -m pytest tests -m "not gpu" -q -p no:cacheprovider --rootdir /tmp/tests -c /dev/null -o pythonpath=/tmp/tests --ignore tests/legacy
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pygpumeta
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pygpumeta
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
